<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Qué Falta!</title>

  <!-- Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      padding: 28px 16px 20px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span { color: #e74c3c; }

    .sub {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.8;
    }

    .leyenda {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 14px;
      font-size: 13px;
    }

    .leyenda div {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      opacity: 0.3;
      cursor: pointer;
    }

    .verde { background: #2ecc71; }
    .amarillo { background: #f1c40f; }
    .rojo { background: #e74c3c; }
    .activo { opacity: 1; }

    .container {
      padding: 16px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      margin-top: 32px;
      font-size: 20px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 6px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      background: #fff;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .item span {
      font-size: 15px;
      font-weight: 500;
    }

    .semaforo {
      display: flex;
      gap: 10px;
      justify-content: center;
      min-width: 90px;
    }

    .acciones {
      margin: 32px 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    input, select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      padding: 11px 18px;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      background: #e74c3c;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
    }

    button.secondary { background: #444; }
    button:hover { opacity: 0.9; }

    #searchBar {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .delete {
      background: transparent;
      color: #999;
      font-size: 18px;
    }

    .delete:hover { color: #e74c3c; }
  </style>
</head>
<body>

<header>
  <div class="logo">¡Qué <span>Falta</span>!</div>
  <div class="sub">Control simple de compras del hogar</div>

  <div class="leyenda">
    <div><div class="dot rojo activo"></div> Falta</div>
    <div><div class="dot amarillo activo"></div> Queda poco</div>
    <div><div class="dot verde activo"></div> Hay stock</div>
  </div>
</header>

<div class="container">
  <input type="text" id="searchBar" placeholder="Buscar producto..." oninput="dibujarLista()" />
  <div id="app"></div>

  <div class="acciones">
    <input type="text" id="nuevoProducto" placeholder="Nuevo producto" />
    <select id="categoriaNew"></select>
    <button onclick="agregarProducto()">Agregar</button>
    <button class="secondary" onclick="mostrarLista()">Lista de compras</button>
    <button class="secondary" onclick="descargarLista()">Descargar lista</button>
  </div>

  <div id="panelLista" style="display:none; margin-top:30px;">
    <h2>🛒 Lista de compras</h2>
    <div id="listaCompras"></div>
  </div>
</div>

<script>
// ---------------- DATOS BASE ----------------
const defaultData = {
  "Verduras y frutas": ["Papas","Tomates","Cebolla","Zanahoria","Banana","Manzana","Lechuga","Zapallito"],
  "Carnes y pescados": ["Milanesas","Carne picada","Pollo","Filet de merluza","Chorizo"],
  "Lácteos y panificados": ["Leche","Queso","Yogur","Manteca","Pan"],
  "Secos y almacén": ["Arroz","Fideos","Harina","Aceite","Yerba","Azúcar","Café"],
  "Limpieza": ["Lavandina","Detergente","Jabón para ropa","Bolsas de basura"],
  "Higiene personal": ["Jabón","Shampoo","Pasta dental","Papel higiénico"],
  "Bebidas": ["Agua","Gaseosa","Vino","Cerveza"]
};

let data = JSON.parse(localStorage.getItem('listaCompra')) || defaultData;
let estado = JSON.parse(localStorage.getItem('estadoProductos')) || {};

// ---------------- INIT ----------------
const categoriaSelect = document.getElementById('categoriaNew');
Object.keys(data).forEach(c => {
  const o = document.createElement('option');
  o.value = c;
  o.textContent = c;
  categoriaSelect.appendChild(o);
});

Object.values(data).flat().forEach(p => {
  if (!estado[p]) estado[p] = 'verde';
});

// ---------------- STORAGE ----------------
function guardar() {
  localStorage.setItem('listaCompra', JSON.stringify(data));
  localStorage.setItem('estadoProductos', JSON.stringify(estado));
}

// ---------------- UI ----------------
function dibujarLista() {
  const filtro = document.getElementById('searchBar').value.toLowerCase();
  const app = document.getElementById('app');
  app.innerHTML = '';

  Object.keys(data).forEach(cat => {
    const items = data[cat].filter(p => p.toLowerCase().includes(filtro));
    if (!items.length) return;

    const h2 = document.createElement('h2');
    h2.textContent = cat;
    app.appendChild(h2);

    items.forEach(p => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <span>${p}</span>
        <div class="semaforo">
          <div class="dot verde ${estado[p]==='verde'?'activo':''}" onclick="setEstado('${p}','verde')"></div>
          <div class="dot amarillo ${estado[p]==='amarillo'?'activo':''}" onclick="setEstado('${p}','amarillo')"></div>
          <div class="dot rojo ${estado[p]==='rojo'?'activo':''}" onclick="setEstado('${p}','rojo')"></div>
        </div>
        <button class="delete" onclick="eliminarProducto('${cat}','${p}')">×</button>
      `;
      app.appendChild(div);
    });
  });

  guardar();
}

function setEstado(producto, color) {
  estado[producto] = color;
  dibujarLista();
}

function agregarProducto() {
  const p = document.getElementById('nuevoProducto').value.trim();
  const c = document.getElementById('categoriaNew').value;
  if (!p) return;

  if (!data[c].includes(p)) {
    data[c].push(p);
    estado[p] = 'verde';
  }

  document.getElementById('nuevoProducto').value = '';
  dibujarLista();
}

function eliminarProducto(categoria, producto) {
  data[categoria] = data[categoria].filter(x => x !== producto);
  delete estado[producto];
  dibujarLista();
}

// ---------------- LISTA DE COMPRAS ----------------
function obtenerFaltantes() {
  return Object.keys(estado).filter(p => estado[p] !== 'verde');
}

function mostrarLista() {
  const panel = document.getElementById('panelLista');
  const lista = document.getElementById('listaCompras');
  const faltantes = obtenerFaltantes();

  panel.style.display = 'block';
  lista.innerHTML = '';

  if (!faltantes.length) {
    lista.innerHTML = '<p>✅ No hay productos pendientes.</p>';
    return;
  }

  faltantes.forEach(p => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span>${p}</span><span>${estado[p] === 'rojo' ? '🔴 Falta' : '🟡 Queda poco'}</span>`;
    lista.appendChild(div);
  });
}

function descargarLista() {
  const faltantes = obtenerFaltantes();
  let texto = 'Lista de compras – ¡Qué Falta!\n\n';

  faltantes.forEach(p => {
    texto += '- ' + p + '\n';
  });

  const blob = new Blob([texto], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lista_compras.txt';
  a.click();
}

// ---------------- START ----------------
dibujarLista();
</script>
</body>
</html>
